[package]
name = "calcit_wasmtime"
version = "0.1.2"
edition = "2024"
description = "Wasmtime bindings for the Calcit language"
license = "MIT"
repository = "https://github.com/calcit-lang/calcit_wasmtime"
readme = "README.md"

[lib]
name = "calcit_wasmtime"
path = "src/lib.rs"
crate-type = ["rlib", "dylib"] # Creates dynamic lib

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cirru_parser = "0.2.4"
cirru_edn = "0.8.0"
wasmtime = { version = "26.0.1", features = ['gc'] }
regex = "1.11"
lazy_static = "1.5.0"
