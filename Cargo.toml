[package]
name = "calcit_wasmtime"
version = "0.1.4"
edition = "2024"
description = "Wasmtime bindings for the Calcit language"
license = "MIT"
repository = "https://github.com/calcit-lang/calcit_wasmtime"
readme = "README.md"

[lib]
name = "calcit_wasmtime"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"] # Keep Rust linking support while exposing only the stable C ABI dynamically.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calcit_native_ffi = "0.1.0"
cirru_parser = "0.2.4"
cirru_edn = "0.8.0"
wasmtime = { version = "26.0.1", features = ['gc'] }
regex = "1.11"
lazy_static = "1.5.0"
