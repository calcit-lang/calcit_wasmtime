on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1
        with:
          tools: calcit,caps

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo run --example try_api

      - run: cargo build --release

      - name: Verify versioned C-safe module exports
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_wasmtime.so)"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_free$' <<<"$exports"
          grep -q ' format_to_wat_calcit_ffi_v1$' <<<"$exports"
          grep -q ' run_wat_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|format_to_wat|run_wat|calcit_ffi_build_id)$' <<<"$exports"

      - run: rm -rfv dylibs && mkdir dylibs/ && cp -v target/release/libcalcit_wasmtime.so dylibs/

      - run: caps --strict --ci

      - run: calcit calcit.cirru edit format && git diff --exit-code -- calcit.cirru

      - run: calcit calcit.cirru --check-only

      - run: calcit calcit.cirru
