on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          version: "0.28.0"
          tools: calcit,caps
          caps-version: "0.1.1"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --example try_api

      - run: cargo build --locked --release

      - name: Verify versioned C-safe module exports
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_wasmtime.so)"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_free$' <<<"$exports"
          grep -q ' format_to_wat_calcit_ffi_v1$' <<<"$exports"
          grep -q ' run_wat_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|format_to_wat|run_wat|calcit_ffi_build_id)$' <<<"$exports"

      - run: mkdir -p dylibs && cp -v target/release/libcalcit_wasmtime.so dylibs/

      - run: caps --strict --ci
      - run: caps verify --toolchain

      - run: calcit calcit.cirru edit format && git diff --exit-code -- calcit.cirru

      - run: calcit calcit.cirru --strict-types --warn-dyn-method --check-only
      - run: calcit calcit.cirru analyze check-public --ns wasmtime.core --ns wasmtime.util --ns wasmtime.demo

      - run: calcit calcit.cirru
